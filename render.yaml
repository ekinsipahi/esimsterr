# Render Blueprint — Django web service + two cron jobs.
# In Render: New → Blueprint → connect this repo, then fill the `sync: false`
# secrets in the dashboard. The database is external (Supabase), so do NOT add a
# Render Postgres here: it would inject DATABASE_URL and override the DB_* vars.

services:
  - type: web
    name: esimsterr
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application --timeout 120 --graceful-timeout 30 --workers 2 --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      # --- Supabase Postgres (session pooler, port 5432) ---
      # DB_USER is "postgres.<project-ref>" — copy it from Supabase → Connect.
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "postgres"
      - key: DB_PORT
        value: "5432"

      # --- Site identity / SEO ---
      - key: SITE_URL              # https://esimsterr.com
        sync: false
      - key: CANONICAL_HOST        # esimsterr.com
        sync: false

      # --- Legal identity (Sterr Technologies OÜ, Estonian registry 17591465) ---
      # Printed in the terms imprint and the privacy policy. The defaults in
      # settings.py are already correct; these exist so a change does not need a
      # code deploy.
      - key: COMPANY_LEGAL_NAME
        value: "Sterr Technologies OÜ"
      - key: COMPANY_REGISTRATION
        value: "17591465"
      - key: COMPANY_ADDRESS
        value: "Tornimäe tn 5, Kesklinna linnaosa, 10145 Tallinn, Estonia"
      - key: LEGAL_JURISDICTION
        value: "Estonia"
      - key: LEGAL_COURTS
        value: "Harju County Court, Tallinn"
      # Fill once VAT-registered; the imprint omits it while empty.
      - key: COMPANY_VAT
        sync: false
      - key: ALLOWED_HOSTS         # esimsterr.com,www.esimsterr.com,esimsterr.onrender.com
        sync: false
      - key: CSRF_TRUSTED_ORIGINS  # https://esimsterr.com,https://www.esimsterr.com
        sync: false
      - key: REDIRECT_HOSTS        # www.esimsterr.com,esimsterr.onrender.com
        sync: false

      # --- eSIM provider ---
      - key: YESIM_API_TOKEN
        sync: false
      - key: YESIM_WEBHOOK_SECRET
        generateValue: true

      # --- Pricing strategy ---
      - key: EUR_USD_RATE
        value: "1.10"
      - key: PRICING_MARKUP
        value: "1.65"
      - key: PRICING_MIN_MARGIN_USD
        value: "0.60"
      - key: PRICING_MIN_PRICE_USD
        value: "1.49"

      # --- Payments ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false

      # --- Email / auth / analytics ---
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL    # eSIMsterr <noreply@esimsterr.com>
        sync: false
      - key: SUPPORT_EMAIL         # support@esimsterr.com
        sync: false
      - key: ADMIN_NOTIFY_EMAILS   # your address, comma-separated
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Cloudflare Turnstile (bot check on signup / sign-in / reset) ---
      # Cloudflare dashboard > Turnstile > add a widget for esimsterr.com.
      # Both keys or neither: with either missing the check is off, and the
      # build log says so.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # Force 3-D Secure on card payments. "automatic" hands the decision back
      # to Stripe if the extra step ever costs more than the fraud does.
      - key: STRIPE_3DS_MODE
        value: "challenge"
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        generateValue: true

      # --- Languages: only serve a locale once its .po file is translated ---
      - key: ENABLED_LANGUAGES
        value: "en"

      # --- Subscriptions (Stripe recurring, unlimited plans) ---
      - key: SUBSCRIPTIONS_ENABLED
        value: "True"
      - key: SUBSCRIPTION_DISCOUNT_PCT
        value: "15"

      # --- Struck-through list price = wholesale cost x this ---
      - key: PRICING_COMPARE_MULTIPLIER
        value: "4.0"

      # --- In-site AI assistant (signed-in customers only) ---
      - key: ASSISTANT_ENABLED
        value: "True"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPPORT_FORWARD_EMAIL
        sync: false

      # Shown as "last updated" on the legal pages; bump on a real revision.
      - key: LEGAL_UPDATED
        sync: false

  # Refresh eSIM usage + retry any order stuck after a provider hiccup.
  # ---------------------------------------------------------------------------
  # Staging. A whole separate world, and the point of it is the Stripe keys:
  # testing a payment flow against live keys means either real money or a
  # half-tested flow, and neither is acceptable before a store release.
  #
  # No DB_* variables on purpose -- with none set the app falls back to SQLite on
  # the instance disk, which Render wipes on every deploy. For a test
  # environment that is a feature: each deploy starts from a clean catalogue and
  # no accounts, so a test never inherits yesterday's mess.
  - type: web
    name: esimsterr-staging
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn core.wsgi:application --timeout 120 --workers 2 --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

      - key: SITE_URL
        value: "https://esimsterr-staging.onrender.com"
      - key: CANONICAL_HOST
        value: "esimsterr-staging.onrender.com"
      - key: ALLOWED_HOSTS
        value: "esimsterr-staging.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://esimsterr-staging.onrender.com"
      # Never let a test environment into a search index.
      - key: SEO_NOINDEX
        value: "True"

      # --- Stripe TEST keys. sk_test_... / pk_test_... ---
      # Card 4242 4242 4242 4242, any future expiry, any CVC.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISH_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # --- The provider. Real catalogue, real eSIMs, real cost. ---
      # Yesim has no sandbox, so this is the same token and the same money.
      # Buy the cheapest plan you can when testing provisioning.
      - key: YESIM_API_TOKEN
        sync: false

      # --- The admin test tool. Set it here, never on production. ---
      - key: ADMIN_TEST_TOKEN
        sync: false

      # Cloudflare's always-passes test pair, so a scripted test run is not
      # fighting a captcha. Never these values on production.
      - key: TURNSTILE_SITE_KEY
        value: "1x00000000000000000000AA"
      - key: TURNSTILE_SECRET_KEY
        value: "1x0000000000000000000000000000000AA"

      # Off in staging: nobody needs a sale alert from a test purchase, and a
      # staging deploy that emails customers is a staging deploy that has
      # escaped.
      - key: ADMIN_NOTIFY_EMAILS
        value: ""
      - key: RESEND_API_KEY
        sync: false
      - key: GA_MEASUREMENT_ID
        value: ""
      - key: SENTRY_DSN
        value: ""

  - type: cron
    name: esimsterr-usage-sync
    runtime: python
    plan: free
    schedule: "*/20 * * * *"
    buildCommand: "pip install -r requirements.txt"
    # renew_subscriptions runs first because it is the only job here that moves
    # money, and a renewal that waits on a provider sync finishing is a line
    # that goes dark for a customer who has the balance to keep it. It never
    # exits non-zero on a single failed subscription, so it cannot hold the
    # chain up either.
    startCommand: "python manage.py renew_subscriptions && python manage.py sync_usage && python manage.py retry_orders && python manage.py expire_coupon_holds"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "postgres"
      - key: DB_PORT
        value: "5432"
      - key: YESIM_API_TOKEN
        sync: false
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: esimsterr
          envVarKey: DJANGO_SECRET_KEY
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFY_EMAILS
        sync: false

  # Re-mirror the provider catalogue and re-price nightly.
  - type: cron
    name: esimsterr-catalogue-sync
    runtime: python
    plan: free
    schedule: "30 3 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py sync_plans && python manage.py seed_country_seo && python manage.py purge_fingerprints"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "postgres"
      - key: DB_PORT
        value: "5432"
      - key: YESIM_API_TOKEN
        sync: false
      - key: EUR_USD_RATE
        value: "1.10"
      - key: PRICING_MARKUP
        value: "1.65"
      - key: PRICING_MIN_MARGIN_USD
        value: "0.60"
      - key: PRICING_MIN_PRICE_USD
        value: "1.49"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: esimsterr
          envVarKey: DJANGO_SECRET_KEY
