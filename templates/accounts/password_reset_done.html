{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="shell auth-wrap center">
    <div class="card card-solid">
      <div style="font-size:2.2rem">📬</div>
      <h1 class="mt-2" style="font-size:1.6rem">Check your inbox</h1>
      <p class="muted mt-2">If an account exists for that address, a reset link is on its way.
        It expires in a few hours. Check spam if it does not arrive within a minute.</p>
      <a class="btn btn-ghost mt-3" href="{% url 'login' %}">Back to sign in</a>
    </div>
  </div>
</section>
{% endblock %}
