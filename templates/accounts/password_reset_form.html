{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="shell auth-wrap">
    <div class="center mb-3"><h1 style="font-size:1.9rem">Reset your password</h1>
      <p class="muted mt-1">We email you a link that signs you straight in to set a new one.</p></div>
    <div class="card card-solid">
      <form method="post" class="stack">
        {% csrf_token %}
        <div class="field">
          <label for="id_email">Email</label>
          <input class="input" type="email" name="email" id="id_email" required autocomplete="email">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      </form>
    </div>
    <p class="center small muted mt-3"><a class="link" href="{% url 'login' %}">Back to sign in</a></p>
  </div>
</section>
{% endblock %}
